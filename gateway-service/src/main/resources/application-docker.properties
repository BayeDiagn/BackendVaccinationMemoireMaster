LOCATION_SERVICE_URL=http://location-service:9090
VACCINATION_SERVICE_URL=http://vaccination-service:8088
VACCINE_SERVICE_URL=http://vaccine-service:8087
AUTH_SERVICE_URL=http://auth-service1:8089
