# Profil Docker : les services sont joignables par leur nom de conteneur.
# On ne redéfinit PAS spring.cloud.gateway.routes[...] ici : Spring Boot remplacerait
# la liste entière et les routes perdraient leurs predicates/filtres.
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka
USER_SERVICE_URL=http://user-service:8083
